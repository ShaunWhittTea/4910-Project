<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Driver</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Edit Driver</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="POST">

        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            value="{{ driver['first_name'] }}"
            required
        >

        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            value="{{ driver['last_name'] }}"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ driver['email'] }}"
            required
        >

        <label for="phone">Phone</label>
        <input
            type="text"
            id="phone"
            name="phone"
            value="{{ driver['phone'] or '' }}"
        >

        <label for="shipping_address">Shipping Address</label>
        <input
            type="text"
            id="shipping_address"
            name="shipping_address"
            value="{{ driver['shipping_address'] or '' }}"
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

    <a href="{{ url_for('sponsor_drivers') }}">
        <button type="button">Cancel</button>
    </a>

</div>

</body>
</html>
