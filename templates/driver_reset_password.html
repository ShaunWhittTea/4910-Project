<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a New Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<main class="container password-page">
    <h1>Choose a New Password</h1>

    {% if message %}
        <p class="message{% if not valid_link %} message-error{% endif %}"
           role="alert">{{ message }}</p>
    {% endif %}

    {% if valid_link %}
        <form method="POST">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password"
                   minlength="12" autocomplete="new-password" required>

            <div class="password-requirements" aria-label="Password requirements">
                <strong>Password requirements</strong>
                <ul>
                    {% for requirement in password_requirements %}
                        <li>{{ requirement }}</li>
                    {% endfor %}
                </ul>
            </div>

            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password"
                   name="confirm_password" minlength="12"
                   autocomplete="new-password" required>
            <button type="submit">Reset Password</button>
        </form>
    {% else %}
        <a class="button-link" href="{{ url_for('driver_forgot_password') }}">
            Request a New Reset Link
        </a>
    {% endif %}

    <div class="actions">
        <a class="button-link" href="{{ url_for('login') }}">Back to Sign In</a>
    </div>
</main>
</body>
</html>
