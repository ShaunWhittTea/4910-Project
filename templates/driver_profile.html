<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Driver Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
<main class="container">
    <h1>My Driver Profile</h1>

    {% if message %}
        <p class="message" role="status">{{ message }}</p>
    {% endif %}

    <dl class="profile-summary">
        <div>
            <dt>Sponsor</dt>
            <dd>{{ user['sponsor_name'] }}</dd>
        </div>
        <div>
            <dt>Point Balance</dt>
            <dd>{{ user['point_balance'] }}</dd>
        </div>
    </dl>

    <form method="POST">
        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            value="{{ user['first_name'] }}"
            maxlength="80"
            autocomplete="given-name"
            required
        >

        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            value="{{ user['last_name'] }}"
            maxlength="80"
            autocomplete="family-name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ user['email'] }}"
            maxlength="255"
            autocomplete="email"
            required
        >

        <label for="phone">Phone</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ user['phone'] or '' }}"
            maxlength="40"
            autocomplete="tel"
        >

        <label for="shipping_address">Shipping Address</label>
        <textarea
            id="shipping_address"
            name="shipping_address"
            maxlength="400"
            autocomplete="street-address"
            rows="4"
        >{{- user['shipping_address'] or '' -}}</textarea>

        <button type="submit">Save Changes</button>
    </form>

    <div class="actions">
        <a class="button-link" href="{{ url_for('driver_dashboard') }}">
            Back to Dashboard
        </a>
        <form class="inline-form" method="POST" action="{{ url_for('driver_logout') }}">
            <button type="submit">Sign Out</button>
        </form>
    </div>
</main>
</body>
</html>
