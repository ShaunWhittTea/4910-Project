<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Driver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="container">

    <h1>Create New Driver</h1>

    <p>Create a driver and assign them to an existing sponsor organization.</p>

    {% if message %}
        <p class="message" role="status">{{ message }}</p>
    {% endif %}

    <form method="POST">

        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name"
               maxlength="80" required>

        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name"
               maxlength="80" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               maxlength="255" required>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone"
               maxlength="40">

        <label for="password">Temporary Password</label>
        <input type="password" id="password" name="password"
               minlength="8" required>

        <label for="sponsor_org_id">Sponsor Organization</label>
        <select id="sponsor_org_id" name="sponsor_org_id" required>
            <option value="">Select a Sponsor Organization</option>

            {% for sponsor in sponsors %}
                <option value="{{ sponsor['sponsor_org_id'] }}">
                    {{ sponsor['name'] }}
                </option>
            {% endfor %}
        </select>

        <label for="shipping_address">Shipping Address</label>
        <textarea
            id="shipping_address"
            name="shipping_address"
            maxlength="400"
            rows="4"
        ></textarea>

        <button type="submit">Create Driver</button>

    </form>

    <div class="actions">
        <a class="button-link" href="{{ url_for('admin_home') }}">
            Back to Admin Home
        </a>
    </div>

</div>

</body>
</html>
