<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Organization Profile</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Organization Profile</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="POST">

        <label for="name">Organization Name</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ organization['name'] }}"
            required
        >

        <label for="contact_email">Contact Email</label>
        <input
            type="email"
            id="contact_email"
            name="contact_email"
            value="{{ organization['contact_email'] }}"
            required
        >

        <label for="phone">Phone</label>
        <input
            type="text"
            id="phone"
            name="phone"
            value="{{ organization['phone'] or '' }}"
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

    <p>
        <strong>Point Dollar Value:</strong>
        ${{ organization["point_dollar_value"] }}
    </p>

    <p>
        <strong>Status:</strong>
        {{ organization["status"] }}
    </p>

    <a href="{{ url_for('sponsor_dashboard') }}">
        <button type="button">Back to Dashboard</button>
    </a>

</div>

</body>
</html>
