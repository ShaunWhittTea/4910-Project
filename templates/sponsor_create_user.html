<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Sponsor User</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Create Sponsor User</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="POST">

        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            required
        >

        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="phone">Phone</label>
        <input
            type="text"
            id="phone"
            name="phone"
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Create Sponsor
        </button>

    </form>

    <a href="{{ url_for('sponsor_dashboard') }}">
        <button type="button">Back to Dashboard</button>
    </a>

</div>

</body>
</html>
