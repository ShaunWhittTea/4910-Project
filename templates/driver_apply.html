<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="container">

    <h1>Driver Application</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <p>Fill out the application below to apply to a sponsor organization.</p>

    <form method="POST">

        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            required
        >

        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="phone">Phone</label>
        <input
            type="text"
            id="phone"
            name="phone"
            required
        >

        <label for="has_license">Do you have a valid driver's license?</label>
        <select id="has_license" name="has_license" required>
            <option value="">Select an option</option>
            <option value="YES">Yes</option>
            <option value="NO">No</option>
        </select>

        <label for="sponsor_org_id">Organization</label>
        <select id="sponsor_org_id" name="sponsor_org_id" required>
            <option value="">Select an organization</option>

            {% for organization in organizations %}
                <option value="{{ organization.sponsor_org_id }}">
                    {{ organization.name }}
                </option>
            {% endfor %}

        </select>

        <label for="password">Create Password</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <div class="password-requirements" aria-label="Password requirements">
            <strong>Password requirements</strong>
            <ul>
                {% for requirement in password_requirements %}
                    <li>{{ requirement }}</li>
                {% endfor %}
            </ul>
        </div>

        <label for="confirm_password">Confirm Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <button type="submit">Submit Application</button>

    </form>

    <a href="{{ url_for('home') }}">
        <button type="button">Back to Home</button>
    </a>

</div>

</body>
</html>
