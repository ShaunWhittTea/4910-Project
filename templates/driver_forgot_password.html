<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Driver Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<main class="container password-page">
    <h1>Reset Your Password</h1>
    <p>Enter the email address for your driver account.</p>

    {% if message %}
        <p class="message" role="status">{{ message }}</p>
    {% endif %}

    <form method="POST">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}"
               autocomplete="email" required>
        <button type="submit">Request Reset Link</button>
    </form>

    {% if reset_link %}
        <div class="local-reset-link" role="status">
            <strong>Local testing link</strong>
            <p><a href="{{ reset_link }}">Continue to reset your password</a></p>
            <p>This link is displayed only when local reset-link testing is enabled.</p>
        </div>
    {% endif %}

    <div class="actions">
        <a class="button-link" href="{{ url_for('login') }}">Back to Sign In</a>
    </div>
</main>
</body>
</html>
