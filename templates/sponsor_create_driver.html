<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Driver</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="container">

    <h1>Create New Driver</h1>

    <p>Add a new driver to your organization.</p>

    {% if message %}
        <p><strong>{{ message }}</strong></p>
    {% endif %}

    <form method="POST">

        <label>First Name:</label>
        <input type="text"
               name="first_name"
               required>

        <br><br>

        <label>Last Name:</label>
        <input type="text"
               name="last_name"
               required>

        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               required>

        <br><br>

        <label>Phone:</label>
        <input type="text"
               name="phone">

        <br><br>

        <label>Temporary Password:</label>
        <input type="password"
               name="password"
               minlength="8"
               required>

        <br><br>

        <label>Shipping Address:</label>
        <input type="text"
               name="shipping_address">

        <br><br>

        <button type="submit">
            Create Driver
        </button>

    </form>

    <br>

    <a href="{{ url_for('sponsor_dashboard') }}">
        <button type="button">
            Back to Dashboard
        </button>
    </a>

</div>

</body>
</html>
