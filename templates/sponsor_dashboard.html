<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sponsor Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Sponsor Dashboard</h1>

    <p>Welcome! You are successfully logged in.</p>

    <div class="dashboard-grid">

        <a href="{{ url_for('sponsor_profile') }}">
            <button type="button">My Profile</button>
        </a>

        <a href="{{ url_for('sponsor_organization') }}">
            <button type="button">Organization Profile</button>
        </a>

        <a href="{{ url_for('sponsor_drivers') }}">
            <button type="button">Driver Data</button>
        </a>

        <a href="{{ url_for('sponsor_communications') }}">
            <button type="button">Sponsor Communications</button>
        </a>

        <a href="{{ url_for('sponsor_points') }}">
            <button type="button">Point Management</button>
        </a>

        <a href="{{ url_for('sponsor_point_history') }}">
            <button type="button">Point Tracking</button>
        </a>

        <a href="{{ url_for('sponsor_orders') }}">
            <button type="button">Order Management</button>
        </a>

        <a href="{{ url_for('sponsor_create_driver') }}">
            <button type="button">Create New Driver</button>
        </a>

    </div>

    <div class="dashboard-logout">
        <a href="{{ url_for('sponsor_logout') }}">
            <button type="button">Logout</button>
        </a>
    </div>

</div>

</body>
</html>
