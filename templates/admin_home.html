<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Home</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-car"></i>
            <span class="brand-name">WIDE LOAD</span>
        </div>

        <div class="nav-links">
            <a href="{{ url_for('admin_profile') }}" class="about-link">
                Profile
            </a>

            <form
                action="{{ url_for('logout') }}"
                method="POST"
                onsubmit="return confirm('Are you sure you want to log out?');"
            >
                <button type="submit" class="login-button">
                    <i class="fa-solid fa-user"></i>
                    <span>Logout</span>
                </button>
            </form>
        </div>
    </nav>



    <section class="admin-management">

        <h2>User Management</h2>

        <div class="admin-management-options">

            <a
                href="{{ url_for('admin_create_driver') }}"
                class="admin-management-card"
            >
                <h3>Create Driver</h3>
                <p>Create a new driver and assign them to a sponsor organization.</p>
            </a>


            <a
                href="{{ url_for('admin_create_sponsor') }}"
                class="admin-management-card"
            >
                <h3>Create Sponsor</h3>
                <p>Create a new sponsor and assign or create an organization.</p>
            </a>


            <a
                href="{{ url_for('admin_create_admin') }}"
                class="admin-management-card"
            >
                <h3>Create Admin</h3>
                <p>Create another administrator account.</p>
            </a>

        </div>

    </section>

</body>

</html>
