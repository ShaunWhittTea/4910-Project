<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<main class="container password-page">
    <h1>Change Password</h1>

    {% if message %}
        <p class="message message-error" role="alert">{{ message }}</p>
    {% endif %}

    <form method="POST">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password"
               autocomplete="current-password" required>

        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password"
               minlength="12" autocomplete="new-password" required>

        <div class="password-requirements" aria-label="Password requirements">
            <strong>Password requirements</strong>
            <ul>
                {% for requirement in password_requirements %}
                    <li>{{ requirement }}</li>
                {% endfor %}
            </ul>
        </div>

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password"
               name="confirm_password" minlength="12"
               autocomplete="new-password" required>
        <button type="submit">Change Password</button>
    </form>

    <div class="actions">
        <a class="button-link" href="{{ url_for('driver_profile') }}">
            Back to Profile
        </a>
    </div>
</main>
</body>
</html>
